<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06080c;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #06080c;
    }
  </style>
</head>
<body>
  <canvas id="mc"></canvas>

  <script>
    const canv = document.getElementById('mc');
    const ctx = canv.getContext('2d');

    const CELL_SIZE = 26;
    let cols = 0;
    let rows = 0;
    let offsetX = 0;
    let offsetY = 0;

    let gameStarted = false;
    let dir = { x: 1, y: 0 };
    let inputQueue = [];

    // Head position in floating-point grid coordinates
    let headX = 0;
    let headY = 0;
    let pathHistory = []; // [{x, y}]

    const baseSpeed = 7.5; // Grid cells per second
    let speed = baseSpeed;

    let apples = [];
    let currentLength = 6.0;
    let targetLength = 6.0;
    const minLength = 3.0;
    let isBurning = false;
    let invulnerableTimer = 0;
    let particles = [];

    function initSnake() {
      cols = Math.floor(canv.width / CELL_SIZE) || 20;
      rows = Math.floor(canv.height / CELL_SIZE) || 20;

      headX = Math.floor(cols / 2);
      headY = Math.floor(rows / 2);

      dir = { x: 1, y: 0 };
      inputQueue = [];
      pathHistory = [];

      currentLength = 6.0;
      targetLength = 6.0;
      speed = baseSpeed;
      isBurning = false;
      invulnerableTimer = 0;

      // Seed initial straight path history behind head
      const stepCount = 120;
      for (let i = 0; i <= stepCount; i++) {
        const dist = (i / stepCount) * currentLength;
        pathHistory.push({
          x: (headX - dist + cols) % cols,
          y: headY
        });
      }
    }

    function resizeCanvas() {
      canv.width = window.innerWidth;
      canv.height = window.innerHeight;

      cols = Math.floor(canv.width / CELL_SIZE);
      rows = Math.floor(canv.height / CELL_SIZE);

      offsetX = Math.floor((canv.width - cols * CELL_SIZE) / 2);
      offsetY = Math.floor((canv.height - rows * CELL_SIZE) / 2);

      if (!gameStarted) {
        initSnake();
        apples = [];
        spawnApple();
      }
    }

    function init() {
      resizeCanvas();
      document.addEventListener('keydown', handleKeyDown);
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('resize', resizeCanvas);
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    // Input handler with queue for sharp, responsive grid turns
    function handleKeyDown(evt) {
      const key = evt.key ? evt.key.toLowerCase() : '';
      const code = evt.code || '';

      let requestedDir = null;

      if (code === 'KeyA' || code === 'ArrowLeft' || key === 'a' || key === 'ф' || key === 'arrowleft') {
        requestedDir = { x: -1, y: 0 };
      } else if (code === 'KeyW' || code === 'ArrowUp' || key === 'w' || key === 'ц' || key === 'arrowup') {
        requestedDir = { x: 0, y: -1 };
      } else if (code === 'KeyD' || code === 'ArrowRight' || key === 'd' || key === 'в' || key === 'arrowright') {
        requestedDir = { x: 1, y: 0 };
      } else if (code === 'KeyS' || code === 'ArrowDown' || key === 's' || key === 'ы' || key === 'arrowdown') {
        requestedDir = { x: 0, y: 1 };
      }

      if (requestedDir) {
        evt.preventDefault();

        if (!gameStarted) {
          gameStarted = true;
          dir = requestedDir;
          return;
        }

        if (inputQueue.length < 2) {
          const lastPlanned = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : dir;
          // Prevent 180-degree instant reversal into own neck
          if (requestedDir.x !== -lastPlanned.x || requestedDir.y !== -lastPlanned.y) {
            if (requestedDir.x !== lastPlanned.x || requestedDir.y !== lastPlanned.y) {
              inputQueue.push(requestedDir);
            }
          }
        }
      }
    }

    // Distance calculation across toroidal wrapped grid
    function getStepDist(p1, p2) {
      let dx = p1.x - p2.x;
      let dy = p1.y - p2.y;
      if (dx > cols / 2) dx -= cols;
      if (dx < -cols / 2) dx += cols;
      if (dy > rows / 2) dy -= rows;
      if (dy < -rows / 2) dy += rows;
      return Math.hypot(dx, dy);
    }

    // Sample body segment coordinates along the historical path
    function getSegmentPositions(totalLen) {
      const segments = [];
      if (pathHistory.length === 0) return segments;

      segments.push({ x: pathHistory[0].x, y: pathHistory[0].y, dist: 0 });

      let currentDist = 0;
      let segIndex = 1;
      const segSpacing = 1.0; // exactly 1 grid cell apart

      for (let i = 0; i < pathHistory.length - 1; i++) {
        const p1 = pathHistory[i];
        const p2 = pathHistory[i + 1];
        const d = getStepDist(p1, p2);

        while (currentDist + d >= segIndex * segSpacing && segIndex < totalLen) {
          const needed = segIndex * segSpacing - currentDist;
          const t = d > 0 ? needed / d : 0;

          let dx = p2.x - p1.x;
          let dy = p2.y - p1.y;
          if (dx > cols / 2) dx -= cols;
          if (dx < -cols / 2) dx += cols;
          if (dy > rows / 2) dy -= rows;
          if (dy < -rows / 2) dy += rows;

          let gx = (p1.x + dx * t + cols) % cols;
          let gy = (p1.y + dy * t + rows) % rows;

          segments.push({ x: gx, y: gy, dist: segIndex * segSpacing });
          segIndex++;
        }

        currentDist += d;
        if (segIndex >= totalLen) break;
      }

      return segments;
    }

    // Convert grid coordinates to canvas pixel position
    function getScreenPos(pt) {
      return {
        x: offsetX + pt.x * CELL_SIZE + CELL_SIZE / 2,
        y: offsetY + pt.y * CELL_SIZE + CELL_SIZE / 2
      };
    }

    let lastTime = performance.now();

    function gameLoop(now) {
      let dt = (now - lastTime) / 1000;
      lastTime = now;
      if (dt > 0.1) dt = 0.1; // Clamp large delta

      if (gameStarted) {
        update(dt);
      }

      // Update particles
      for (let p = particles.length - 1; p >= 0; p--) {
        const pt = particles[p];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.alpha -= pt.decay;
        if (pt.alpha <= 0) {
          particles.splice(p, 1);
        }
      }

      render();
      requestAnimationFrame(gameLoop);
    }

    function update(dt) {
      let moveDist = speed * dt;

      // Handle sharp grid intersection turning
      while (moveDist > 0.0001) {
        let turned = false;

        if (inputQueue.length > 0) {
          const queuedDir = inputQueue[0];

          if (dir.x !== 0 && queuedDir.y !== 0) {
            const targetX = dir.x > 0 ? Math.ceil(headX - 0.0001) : Math.floor(headX + 0.0001);
            let distToTarget = Math.abs(targetX - headX);
            if (distToTarget < 0.00001) distToTarget = 0;

            if (moveDist >= distToTarget) {
              headX = (targetX + cols) % cols;
              pathHistory.unshift({ x: headX, y: headY });
              dir = inputQueue.shift();
              moveDist -= distToTarget;
              turned = true;
            }
          } else if (dir.y !== 0 && queuedDir.x !== 0) {
            const targetY = dir.y > 0 ? Math.ceil(headY - 0.0001) : Math.floor(headY + 0.0001);
            let distToTarget = Math.abs(targetY - headY);
            if (distToTarget < 0.00001) distToTarget = 0;

            if (moveDist >= distToTarget) {
              headY = (targetY + rows) % rows;
              pathHistory.unshift({ x: headX, y: headY });
              dir = inputQueue.shift();
              moveDist -= distToTarget;
              turned = true;
            }
          }
        }

        if (!turned) {
          headX = (headX + dir.x * moveDist + cols) % cols;
          headY = (headY + dir.y * moveDist + rows) % rows;
          pathHistory.unshift({ x: headX, y: headY });
          moveDist = 0;
        }
      }

      // Smooth length adjustment
      if (currentLength > targetLength) {
        currentLength = Math.max(targetLength, currentLength - 5.0 * dt);
        if (currentLength <= targetLength) {
          isBurning = false;
        }
      } else if (currentLength < targetLength) {
        currentLength = Math.min(targetLength, currentLength + 3.0 * dt);
      }

      if (invulnerableTimer > 0) {
        invulnerableTimer -= dt;
      }

      // Trim path history to save memory and keep precise length
      let accDist = 0;
      let cutIndex = pathHistory.length - 1;
      for (let i = 0; i < pathHistory.length - 1; i++) {
        accDist += getStepDist(pathHistory[i], pathHistory[i + 1]);
        if (accDist > currentLength + 2.0) {
          cutIndex = i + 1;
          break;
        }
      }
      if (pathHistory.length > cutIndex + 1) {
        pathHistory.length = cutIndex + 1;
      }

      const segments = getSegmentPositions(currentLength);

      // Spawn burning tail embers
      if (isBurning && segments.length > Math.floor(targetLength)) {
        const tailSeg = segments[segments.length - 1];
        const scr = getScreenPos(tailSeg);
        if (Math.random() < 0.6) {
          particles.push({
            x: scr.x + (Math.random() * 10 - 5),
            y: scr.y + (Math.random() * 10 - 5),
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            radius: Math.random() * 3 + 1.5,
            alpha: 1,
            decay: 0.04,
            color: Math.random() > 0.4 ? '#ff1744' : '#ff7a18'
          });
        }
      }

      // Check Self-Collision against body segments (skip immediate neck)
      if (segments.length > 4 && invulnerableTimer <= 0) {
        for (let k = 3; k < segments.length; k++) {
          const seg = segments[k];
          let dx = Math.abs(headX - seg.x);
          let dy = Math.abs(headY - seg.y);
          if (dx > cols / 2) dx -= cols;
          if (dy > rows / 2) dy -= rows;

          if (dx * dx + dy * dy < 0.36) { // ~0.6 cell distance
            targetLength = Math.max(minLength, k);
            isBurning = true;
            invulnerableTimer = 0.8;
            speed = baseSpeed;

            const scr = getScreenPos(segments[0]);
            for (let p = 0; p < 14; p++) {
              particles.push({
                x: scr.x,
                y: scr.y,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 0.5) * 5,
                radius: Math.random() * 4 + 2,
                alpha: 1,
                decay: Math.random() * 0.03 + 0.02,
                color: Math.random() > 0.5 ? '#ff1744' : '#ff9100'
              });
            }
            break;
          }
        }
      }

      // Check Apple Collisions
      for (let a = apples.length - 1; a >= 0; a--) {
        const ap = apples[a];
        let dx = Math.abs(headX - ap.x);
        let dy = Math.abs(headY - ap.y);
        if (dx > cols / 2) dx -= cols;
        if (dy > rows / 2) dy -= rows;

        if (dx * dx + dy * dy < 0.42) {
          apples.splice(a, 1);
          targetLength += 3.0;
          speed = Math.min(speed + 0.15, 12.0);

          const scr = getScreenPos(ap);
          for (let p = 0; p < 10; p++) {
            particles.push({
              x: scr.x,
              y: scr.y,
              vx: (Math.random() - 0.5) * 4,
              vy: (Math.random() - 0.5) * 4,
              radius: Math.random() * 3 + 1.5,
              alpha: 1,
              decay: 0.04,
              color: '#39ff14'
            });
          }

          spawnApple();
          break;
        }
      }
    }

    // Spawn apple on an empty integer grid cell
    function spawnApple() {
      if (cols === 0 || rows === 0) return;

      const segments = getSegmentPositions(currentLength);
      const availableCells = [];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const inBody = segments.some(s => Math.abs(s.x - c) < 0.7 && Math.abs(s.y - r) < 0.7);
          const inApple = apples.some(ap => ap.x === c && ap.y === r);
          if (!inBody && !inApple) {
            availableCells.push({ x: c, y: r });
          }
        }
      }

      if (availableCells.length > 0) {
        const chosen = availableCells[Math.floor(Math.random() * availableCells.length)];
        apples.push(chosen);
      }

      if (apples.length < 3 && Math.random() > 0.6 && availableCells.length > 1) {
        const chosen = availableCells[Math.floor(Math.random() * availableCells.length)];
        apples.push(chosen);
      }
    }

    // Render loop
    function render() {
      ctx.fillStyle = '#06080c';
      ctx.fillRect(0, 0, canv.width, canv.height);

      // Draw Grid Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let c = 0; c <= cols; c++) {
        const x = offsetX + c * CELL_SIZE;
        ctx.moveTo(x, offsetY);
        ctx.lineTo(x, offsetY + rows * CELL_SIZE);
      }
      for (let r = 0; r <= rows; r++) {
        const y = offsetY + r * CELL_SIZE;
        ctx.moveTo(offsetX, y);
        ctx.lineTo(offsetX + cols * CELL_SIZE, y);
      }
      ctx.stroke();

      // Render Particles
      for (let p = 0; p < particles.length; p++) {
        const pt = particles[p];
        ctx.save();
        ctx.globalAlpha = Math.max(0, pt.alpha);
        ctx.fillStyle = pt.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Render Apples
      const pulse = Math.sin(performance.now() * 0.006) * 1.5;
      for (let a = 0; a < apples.length; a++) {
        const scr = getScreenPos(apples[a]);

        ctx.save();
        ctx.shadowBlur = 15 + pulse * 2;
        ctx.shadowColor = '#ff2442';

        ctx.fillStyle = '#ff2442';
        ctx.beginPath();
        ctx.arc(scr.x, scr.y, (CELL_SIZE / 2 - 3) + pulse * 0.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#39ff14';
        ctx.beginPath();
        ctx.arc(scr.x + 3, scr.y - (CELL_SIZE / 2 - 3), 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // Render Snake
      const segments = getSegmentPositions(currentLength);
      const segLen = segments.length;

      // Draw continuous connecting smooth body ribbon
      for (let i = 0; i < segLen - 1; i++) {
        const p1 = getScreenPos(segments[i]);
        const p2 = getScreenPos(segments[i + 1]);
        const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);

        if (dist < CELL_SIZE * 1.8) {
          const isBurningSeg = isBurning && i >= Math.floor(targetLength);
          ctx.save();
          ctx.strokeStyle = isBurningSeg ? '#ff1744' : '#39ff14';
          ctx.lineWidth = CELL_SIZE - 5;
          ctx.lineCap = 'round';
          ctx.shadowBlur = isBurningSeg ? 12 : 8;
          ctx.shadowColor = isBurningSeg ? '#ff1744' : 'rgba(57, 255, 20, 0.5)';
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
          ctx.restore();
        }
      }

      // Draw segment circular joints
      for (let i = 0; i < segLen; i++) {
        const scr = getScreenPos(segments[i]);
        const isBurningSeg = isBurning && i >= Math.floor(targetLength);

        ctx.save();
        if (isBurningSeg) {
          ctx.fillStyle = i % 2 === 0 ? '#ff1744' : '#ff6d00';
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#ff1744';
          ctx.beginPath();
          ctx.arc(scr.x, scr.y, (CELL_SIZE - 5) / 2, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#39ff14';
          ctx.shadowBlur = 6;
          ctx.shadowColor = 'rgba(57, 255, 20, 0.4)';
          ctx.beginPath();
          ctx.arc(scr.x, scr.y, (CELL_SIZE - 5) / 2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // Draw Snake Head with Eyes
      if (segLen > 0) {
        const headScr = getScreenPos(segments[0]);

        ctx.save();
        ctx.fillStyle = '#52ff33';
        ctx.shadowBlur = 14;
        ctx.shadowColor = '#39ff14';
        ctx.beginPath();
        ctx.arc(headScr.x, headScr.y, (CELL_SIZE - 3) / 2, 0, Math.PI * 2);
        ctx.fill();

        // Direction-facing eyes
        ctx.fillStyle = '#000';
        const eyeDist = 4.5;
        const eyeForward = 5.5;
        const ex1 = headScr.x + dir.x * eyeForward - dir.y * eyeDist;
        const ey1 = headScr.y + dir.y * eyeForward + dir.x * eyeDist;
        const ex2 = headScr.x + dir.x * eyeForward + dir.y * eyeDist;
        const ey2 = headScr.y + dir.y * eyeForward - dir.x * eyeDist;

        ctx.beginPath();
        ctx.arc(ex1, ey1, 2.5, 0, Math.PI * 2);
        ctx.arc(ex2, ey2, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  </script>
</body>
</html>
